name: Release

# Run from the Actions tab. The checks of ci.yml run first, then helpers4/action-release computes
# the version from the last v* tag and the Conventional Commits, writes it in package.json and
# jsr.json, adds the section of the version to CHANGELOG.md (the summary written under
# `## [Unreleased]` leads it), builds and dry-runs the npm and JSR packages, pushes the signed
# release commit to main (helpers4-bot, a bypass actor of the ruleset), tags it, publishes to npm
# and JSR with trusted publishing (OIDC, no token) and publishes the GitHub release.
#
# npm and JSR validate this file name: change it only together with their trusted publisher
# settings.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Type of release
        type: choice
        default: auto
        options: [auto, patch, minor, major, alpha, beta, rc, resume]
      dry-run:
        description: Build and dry-run everything, write nothing
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@v6
        with: { version: latest }
      - uses: actions/setup-node@v7
        with: { node-version: lts/*, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: helpers4/action-release@v0
        with:
          bump: ${{ inputs.bump }}
          dry-run: ${{ inputs.dry-run }}
          app-id: ${{ vars.HELPERS4_BOT_ID }}
          app-key: ${{ secrets.HELPERS4_BOT_KEY }}
